[package]
name = "vrcx-0-runtime-host"
version = "0.1.0"
edition = "2021"

[features]
default = []
test-utils = ["vrcx-0-application/test-utils"]

[dependencies]
chrono = { workspace = true }
iana-time-zone.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta.workspace = true
sys-locale.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "macros"] }
tracing = { workspace = true }
vrcx-0-application = { path = "../application" }
vrcx-0-core = { path = "../core" }
vrcx-0-host = { path = "../host" }
vrcx-0-integrations = { path = "../integrations" }
vrcx-0-media = { path = "../media" }
vrcx-0-persistence = { path = "../persistence" }
vrcx-0-vrchat-client = { path = "../vrchat-client" }
uuid.workspace = true
