<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>VRCX-0 Overlay Devtool</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #0b1017;
                --panel: #111923;
                --panel-2: #172232;
                --line: #2b3b4f;
                --text: #edf2f7;
                --muted: #9aa8ba;
                --accent: #2dd4bf;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: var(--bg);
                color: var(--text);
            }
            .shell {
                display: grid;
                grid-template-columns: 320px minmax(0, 1fr);
                min-height: 100vh;
            }
            aside {
                border-right: 1px solid var(--line);
                background: var(--panel);
                padding: 20px;
            }
            main {
                display: grid;
                place-items: center;
                padding: 28px;
                overflow: hidden;
            }
            h1 {
                margin: 0 0 18px;
                font-size: 20px;
                line-height: 1.2;
                letter-spacing: 0;
            }
            .group {
                display: grid;
                gap: 10px;
                margin: 18px 0;
            }
            .label {
                color: var(--muted);
                font-size: 12px;
                text-transform: uppercase;
            }
            select,
            button {
                width: 100%;
                border: 1px solid var(--line);
                background: var(--panel-2);
                color: var(--text);
                border-radius: 6px;
                min-height: 38px;
                padding: 0 10px;
                font: inherit;
            }
            button {
                cursor: pointer;
            }
            button:hover,
            select:hover {
                border-color: var(--accent);
            }
            .row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .meta {
                display: grid;
                gap: 6px;
                color: var(--muted);
                font-size: 13px;
                line-height: 1.4;
            }
            .stage {
                max-width: min(100%, 1180px);
                width: 100%;
                display: grid;
                gap: 12px;
            }
            .viewport {
                background: #05080d;
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 18px;
                display: grid;
                place-items: center;
                min-height: 420px;
            }
            #frame {
                max-width: 100%;
                max-height: calc(100vh - 96px);
                object-fit: contain;
                image-rendering: auto;
                user-select: none;
                touch-action: none;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            #status {
                color: var(--muted);
                font-size: 13px;
                min-height: 18px;
            }
            @media (max-width: 820px) {
                .shell {
                    grid-template-columns: 1fr;
                }
                aside {
                    border-right: 0;
                    border-bottom: 1px solid var(--line);
                }
                main {
                    padding: 16px;
                }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <aside>
                <h1>VRCX-0 Overlay Devtool</h1>
                <div class="group">
                    <div class="label">Surface</div>
                    <select id="surface">
                        <option value="friends">Friends panel</option>
                        <option value="toast">HMD toast</option>
                        <option value="wrist">Wrist feed</option>
                    </select>
                </div>
                <div class="group">
                    <div class="label">Scenario</div>
                    <select id="scenario"></select>
                </div>
                <div class="group">
                    <div class="row">
                        <button id="reset" type="button">Reset</button>
                        <button id="spinner" type="button">Spinner</button>
                    </div>
                    <div class="row">
                        <button id="append-toast" type="button">
                            Append toast
                        </button>
                        <button id="clear-toast" type="button">
                            Clear toast
                        </button>
                    </div>
                </div>
                <div class="group meta">
                    <div id="surface-meta"></div>
                    <div id="hit-meta"></div>
                </div>
            </aside>
            <main>
                <div class="stage">
                    <div class="viewport">
                        <img id="frame" alt="overlay frame" draggable="false" />
                    </div>
                    <div id="status"></div>
                </div>
            </main>
        </div>
        <script>
            const surfaceSelect = document.getElementById('surface');
            const scenarioSelect = document.getElementById('scenario');
            const frame = document.getElementById('frame');
            const statusLine = document.getElementById('status');
            const surfaceMeta = document.getElementById('surface-meta');
            const hitMeta = document.getElementById('hit-meta');
            let state = null;
            let hoverPending = false;
            let dragScroll = null;
            let suppressClick = false;
            let lastHit = null;

            async function api(path, body) {
                const response = await fetch(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body ? JSON.stringify(body) : '{}'
                });
                if (!response.ok) {
                    throw new Error(await response.text());
                }
                return response.json();
            }

            async function loadState() {
                const response = await fetch('/api/state', {
                    cache: 'no-store'
                });
                state = await response.json();
                renderControls();
                refreshFrame();
            }

            function renderControls() {
                surfaceSelect.value = state.surface;
                const scenarios = state.scenarios[state.surface] || [];
                scenarioSelect.replaceChildren(
                    ...scenarios.map((scenario) => {
                        const option = document.createElement('option');
                        option.value = scenario.key;
                        option.textContent = scenario.label;
                        return option;
                    })
                );
                scenarioSelect.value = state.scenario;
                const friends = state.friends || {};
                const toast = state.toast || {};
                surfaceMeta.textContent = `scenario=${state.scenario} rows=${friends.rows ?? '-'} toasts=${toast.toasts ?? '-'}`;
            }

            function refreshFrame() {
                const nextSrc = `/frame.png?t=${Date.now()}`;
                const nextFrame = new Image();
                nextFrame.onload = () => {
                    frame.src = nextSrc;
                };
                nextFrame.src = nextSrc;
            }

            function uvFromEvent(event) {
                const rect = frame.getBoundingClientRect();
                return {
                    x: Math.max(
                        0,
                        Math.min(1, (event.clientX - rect.left) / rect.width)
                    ),
                    y: Math.max(
                        0,
                        Math.min(1, (event.clientY - rect.top) / rect.height)
                    )
                };
            }

            async function sendInput(action, uv, delta = 0) {
                if (!state || state.surface !== 'friends') {
                    return;
                }
                const response = await api('/api/input', {
                    action,
                    x: uv.x,
                    y: uv.y,
                    delta
                });
                state = response.state;
                renderControls();
                const hit = response.result.hit ?? null;
                hitMeta.textContent = `hit=${hit ?? '-'} cat=${response.result.selectedCategory}`;
                const shouldRefresh = action !== 'hover' || hit !== lastHit;
                lastHit = hit;
                if (shouldRefresh) {
                    refreshFrame();
                }
            }

            surfaceSelect.addEventListener('change', async () => {
                const surface = surfaceSelect.value;
                const scenario = (state.scenarios[surface] || [])[0]?.key || '';
                state = await api('/api/select', { surface, scenario });
                renderControls();
                refreshFrame();
            });

            scenarioSelect.addEventListener('change', async () => {
                state = await api('/api/select', {
                    surface: surfaceSelect.value,
                    scenario: scenarioSelect.value
                });
                renderControls();
                refreshFrame();
            });

            document
                .getElementById('reset')
                .addEventListener('click', async () => {
                    state = await api('/api/reset');
                    renderControls();
                    refreshFrame();
                });

            document
                .getElementById('spinner')
                .addEventListener('click', async () => {
                    state = await api('/api/spinner');
                    renderControls();
                    refreshFrame();
                });

            document
                .getElementById('append-toast')
                .addEventListener('click', async () => {
                    state = await api('/api/toast', { action: 'append' });
                    renderControls();
                    refreshFrame();
                });

            document
                .getElementById('clear-toast')
                .addEventListener('click', async () => {
                    state = await api('/api/toast', { action: 'clear' });
                    renderControls();
                    refreshFrame();
                });

            frame.addEventListener('pointerdown', (event) => {
                if (
                    event.button !== 0 ||
                    !state ||
                    state.surface !== 'friends'
                ) {
                    return;
                }
                dragScroll = {
                    pointerId: event.pointerId,
                    lastY: event.clientY,
                    totalY: 0,
                    remainderY: 0,
                    uv: uvFromEvent(event)
                };
                suppressClick = false;
                frame.setPointerCapture(event.pointerId);
                event.preventDefault();
            });

            frame.addEventListener('pointermove', (event) => {
                if (dragScroll && dragScroll.pointerId === event.pointerId) {
                    event.preventDefault();
                    const dy = event.clientY - dragScroll.lastY;
                    dragScroll.lastY = event.clientY;
                    dragScroll.totalY += Math.abs(dy);
                    dragScroll.remainderY += dy;
                    const steps = Math.trunc(dragScroll.remainderY / 24);
                    if (steps !== 0) {
                        const delta = -steps;
                        dragScroll.remainderY -= steps * 24;
                        suppressClick = dragScroll.totalY > 8;
                        sendInput('touchScroll', dragScroll.uv, delta).catch(
                            (error) => {
                                statusLine.textContent = error.message;
                            }
                        );
                    }
                    return;
                }
                if (hoverPending) {
                    return;
                }
                hoverPending = true;
                requestAnimationFrame(() => {
                    hoverPending = false;
                    sendInput('hover', uvFromEvent(event)).catch((error) => {
                        statusLine.textContent = error.message;
                    });
                });
            });

            frame.addEventListener('pointerup', (event) => {
                if (dragScroll && dragScroll.pointerId === event.pointerId) {
                    frame.releasePointerCapture(event.pointerId);
                    suppressClick = dragScroll.totalY > 8;
                    dragScroll = null;
                }
            });

            frame.addEventListener('pointercancel', (event) => {
                if (dragScroll && dragScroll.pointerId === event.pointerId) {
                    frame.releasePointerCapture(event.pointerId);
                    dragScroll = null;
                }
            });

            frame.addEventListener('click', (event) => {
                if (suppressClick) {
                    suppressClick = false;
                    return;
                }
                sendInput('click', uvFromEvent(event)).catch((error) => {
                    statusLine.textContent = error.message;
                });
            });

            frame.addEventListener(
                'wheel',
                (event) => {
                    event.preventDefault();
                    const delta = Math.sign(event.deltaY || 0);
                    if (delta !== 0) {
                        sendInput('scroll', uvFromEvent(event), delta).catch(
                            (error) => {
                                statusLine.textContent = error.message;
                            }
                        );
                    }
                },
                { passive: false }
            );

            loadState().catch((error) => {
                statusLine.textContent = error.message;
            });
        </script>
    </body>
</html>
